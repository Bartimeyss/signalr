# SignalR и Blazor

Как сделать веб-приложение, которое реагирует на события сразу

</script></section>

<section data-markdown><script type="text/template">

## Задача

Пользователь не должен ждать следующего обновления страницы, когда:

- пришло сообщение;
- изменился статус платежа;
- завершилась фоновая операция;
- коллега изменил общий документ.

**Обычный HTTP хорошо отвечает на запрос. Но как серверу начать разговор первым?**

</script></section>

<section data-markdown><script type="text/template">

## Способы получать обновления

| Подход | Идея | Цена |
| --- | --- | --- |
| Polling | «Есть новости?» каждые N секунд | много пустых запросов |
| Long polling | сервер ждёт событие внутри запроса | запрос надо постоянно открывать снова |
| WebSocket | постоянный двусторонний канал | инфраструктура должна его поддерживать |
| SSE | постоянный канал сервер → браузер | сообщения только в одну сторону |

</script></section>

<section data-markdown><script type="text/template">

## SignalR: что он берёт на себя

- выбирает транспорт: **WebSocket → SSE → long polling**;
- держит подключение и умеет восстанавливаться;
- сериализует сообщения;
- даёт модель вызова методов между клиентом и сервером.

Не заменяет HTTP API: API остаётся для страниц, истории и CRUD.
SignalR нужен для новых событий «прямо сейчас».

</script></section>

<section data-markdown><script type="text/template">

## Hub — точка общения

<div class="flow">

Браузер вызывает `SendComment(user, message)` → `CommentsHub` →
сервер рассылает `ReceiveComment(user, message)` всем нужным браузерам.

</div>

```csharp
public class CommentsHub : Hub
{
    public Task SendComment(string user, string message) =>
        Clients.All.SendAsync("ReceiveComment", user, message);
}
```

`SendComment` — метод сервера. `ReceiveComment` — имя обработчика на клиенте.

</script></section>

<section data-markdown><script type="text/template">

## Встраиваем Hub в ASP.NET Core

```csharp
// ConfigureServices
services.AddSignalR();

// Configure → UseEndpoints
endpoints.MapHub<CommentsHub>("/commentsHub");
```

В клиенте создаём подключение к `/commentsHub`, подписываемся на
`ReceiveComment`, затем запускаем `connection.start()`.

</script></section>

<section data-markdown><script type="text/template">

## Учебный чат — не production

- `Clients.All` пошлёт комментарий пользователям **других новостей**.
- Отправленный комментарий пока не сохранён в БД — после refresh исчезнет.
- Hub не хранит состояние приложения.

Следующий шаг в реальном сервисе: группа `news:{articleId}`, проверка прав,
сохранение в БД и рассылка только после успешной записи.

</script></section>

<section data-markdown><script type="text/template">

## Демо: посмотрим на протокол

1. Открываем одну новость в двух вкладках.
2. Отправляем комментарий в первой.
3. Он появляется в обеих без reload.
4. DevTools → **Network → WS**: смотрим кадры с `SendComment` и `ReceiveComment`.

Это не магия: браузер держит подключение и обменивается сообщениями с Hub.

</script></section>

<section data-markdown><script type="text/template">

# Blazor

Интерактивный веб-интерфейс на C#, HTML и CSS

</script></section>

<section data-markdown><script type="text/template">

## Режимы Blazor

- **Static SSR** — сервер отдаёт готовый HTML, без интерактива.
- **Interactive Server** — события UI идут на сервер, изменения DOM возвращаются через SignalR.
- **Interactive WebAssembly** — .NET работает в браузере.
- **Interactive Auto** — серверный старт, затем WebAssembly.

На практике задания мы используем Blazor Server как ещё один клиент SignalR.

</script></section>

<section data-markdown><script type="text/template">

## Что сегодня должно остаться в голове

1. HTTP отвечает на запрос, SignalR доставляет события.
2. Hub — удобный контракт вызовов клиент ↔ сервер.
3. WebSocket предпочтителен, но SignalR умеет fallback.
4. В реальном приложении важны адресаты, права и сохранение данных.

**Практика:** превратим комментарии BadNews в real-time UI.

</script></section>
